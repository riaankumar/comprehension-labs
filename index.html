    <section id="research" aria-labelledby="research-title">
      <h2 id="research-title">Research grounded in human performance</h2>
      <p>Our evaluation design separates the capabilities a single score can hide: recognizing speech, preserving meaning, following an argument, making a judgment, and completing a task.</p>
      <p>For speech, that means distinguishing transcription and comprehension from synthesis quality, pronunciation, and intelligibility. For judgment, it means measuring disagreement, confidence, and evidence quality against independent human review. For work, it means assessing the finished result alongside the process that produced it.</p>
      <p>Permissions are specific to each use. Speech synthesis and voice cloning require explicit authorization; access to a recording alone does not establish those rights.</p>
    </section>
    <h1>Human knowledge for more capable AI.</h1>
    <p>Comprehension Labs is a multimodal data lab founded at UC Berkeley, building rights-cleared, verified human data for frontier AI, grounded in education.</p>
    <p>Comprehension Labs builds data and evaluations around how people learn, speak, reason, and work. We connect human performance with the context, feedback, and judgment needed to train and assess AI systems.</p>
    <p>Our scope spans four data families, from individual speech recordings to complete learning and professional workflows. Education, assessment, and expert practice provide the grounding: tasks with context, feedback, and outcomes that can be reviewed.</p>

    <section id="data" aria-labelledby="data-title">
      <h2 id="data-title">Data across human capabilities</h2>
      <ul>
        <li><strong>Reasoning and judgment.</strong> Debate, research, evidence use, rebuttals, and expert decisions. Structured records of how people support claims, weigh competing arguments, disagree, and revise their conclusions.</li>
        <li><strong>Speech and language.</strong> Speech recognition, text-to-speech (TTS), pronunciation, and language understanding across languages, accents, and dialects. Task-specific data design, from aligned text and recordings for synthesis to conversational context and assessed learner speech.</li>
        <li><strong>Learning and application.</strong> Task attempts, misconceptions, instructor feedback, revisions, and assessed outcomes. Records that connect what someone knows with how they apply it.</li>
        <li><strong>Expert work and computer use.</strong> Professional tasks, tool interactions, intermediate artifacts, corrections, and completed deliverables. Workflows that connect a task specification to an outcome a qualified reviewer can assess.</li>
      </ul>
    </section>

    <section id="scale" aria-labelledby="scale-title">
      <h2 id="scale-title">Depth within every collection. Breadth across capabilities.</h2>
      <p><strong>The largest licensed debate dataset, with 100,000+ contributors.</strong> This scale anchors our work in reasoning and judgment within a broader portfolio spanning learning, speech and TTS, and expert work.</p>
      <p>Our collection design spans languages and dialects, skill levels, task types, and repeated attempts over time. Text, audio, video, and tool interactions connect to the same underlying task where the application and permissions call for them.</p>
      <p>A debate round, for example, can connect speeches, transcripts, opposing arguments, scores, and judges’ explanations. A professional project can connect the brief, tool use, revisions, reviewer feedback, and accepted deliverable. These linked records support distinct training and evaluation tasks while preserving their shared context.</p>
    </section>

    <section aria-labelledby="value-title">
      <h2 id="value-title">Why this data matters</h2>
      <p>A transcript cannot preserve a speaker’s delivery. A final answer cannot show which correction resolved a mistake. A completed project cannot reveal where a workflow broke down. Those missing connections matter when deciding what to train and whether a model is ready for use.</p>
      <p>We design around those connections: aligned speech for TTS, attempts and feedback for learning, evidence and expert disagreement for judgment, and reviewed outcomes for agents doing real work. The value is data tied to a specific capability, with the context and evaluation needed to test progress.</p>
    </section>

    <section id="approach" aria-labelledby="approach-title">
      <h2 id="approach-title">Built to your specification.</h2>
      <p>Define the capability, data requirements, and acceptance test. We design the collection and evaluation around them.</p>
    </section>
