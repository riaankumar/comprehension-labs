    <section id="story" class="narrative-section" aria-labelledby="story-title">
      <h2 id="story-title">AI needs the full path to human capability.</h2>
      <p class="company-description">Comprehension Labs is a multimodal data lab and licensing platform building datasets around how people learn, reason, speak, and work.</p>
      <p>We capture the attempts, feedback, revisions, judgments, and outcomes behind final outputs across debate, speech and TTS, longitudinal learning, and expert work.</p>
      <p>Our team brings research and engineering experience from BAIR, Berkeley EECS, Amazon Alexa, Meta, AppLovin, and Alation, alongside years spent building in education.</p>
      <p>Comprehension Labs began at Berkeley, shaped by our work in education and by watching technology transform how people learn. Edtech captured more answers, scores, and activity than ever before, but often lost the most valuable part: the attempt, the mistake, the feedback, the revision, and the moment something finally clicked.</p>
    </section>
    <section id="approach" class="narrative-section" aria-label="Our approach">
      <p>Many data companies organize the world by modality: audio, video, images, and text. We organize it by how human capability develops. A single artifact shows what someone produced; a trajectory connects the attempt, challenge, feedback, revision, judgment, and outcome. We are building data around those missing paths so models can learn not only from human outputs, but from how people become capable.</p>
    </section>
    <section id="data" class="narrative-section" aria-label="Our datasets">
      <p>Debate became our first branch because it makes reasoning visible. A speaker advances a claim, an opponent challenges it, evidence is tested, and a judge must decide which ideas survive. Our data network includes 100K+ learners and over 300 verified expert transcribers. This is just the start of our work on discernment: whether models can recognize stronger arguments, learn from disagreement, and update instead of reinforcing their own conclusions. Agreement alone is not understanding; several models can confidently share the same mistake.</p>
      <p>We want rights-cleared speech and TTS datasets designed around the capability a model needs: aligned text and speech, pronunciation and prosody coverage, accents and dialects, conversational context, and clear human evaluation. Where useful, longitudinal learner speech can also preserve attempts, corrections, and improvement, supporting models that do more than generate a voice and can better understand the person behind it.</p>
      <p>We think of Comprehension Labs as a tree. Education is the root system: it taught us that intelligence develops through experience. Human trajectories form the trunk: the path from task to attempt, challenge, feedback, revision, judgment, and outcome. From that trunk grow four connected branches: reasoning and judgment; speech and language, including TTS; learning and application; and expert work and computer use.</p>
    </section>
    <section id="research" class="narrative-section" aria-label="Our research">
      <p>We are building Comprehension Labs as a deliberately lean, research-led team. Our advantage should come from asking better questions, finding rare and valuable human signals, and testing whether they make models more capable, not from producing the greatest volume of generic labels.</p>
      <p>The internet records much of what humanity has produced. Comprehension Labs is building the record of how we learned to produce it.</p>
    </section>
    <section id="contact" aria-labelledby="contact-title">
      <h2 id="contact-title">Get in touch</h2>
      <p>Need a custom dataset for debate and judgment, multilingual speech and TTS, longitudinal learning, or expert computer-use workflows?</p>
      <p class="education-partners">If you run an education company, institute, or learning tool, your data captures how people learn, reason, and improve. We help turn those learning journeys, feedback, and expert insights into datasets and reinforcement learning environments for training and evaluating AI. Reach out to explore how you can license and monetise your data.</p>
